workflows:
  ios-testflight:
    name: NextSport iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        EXPO_TOKEN: "LS9tC4kVqw-_uHGBsA3cEaKkPu5T7nS8eSCc7r52H_c"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "C2345LX527"
        APP_STORE_CONNECT_ISSUER_ID: "5fd238fa-843c-4575-a581-bc0cb45b1798"
        BUNDLE_ID: "com.nextsport.app"
        CM_CERTIFICATE: ""
        CM_CERTIFICATE_PASSWORD: "NextSport2026"
      xcode: latest
      node: latest
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Set up signing certificate
        script: |
          echo "" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "NextSport2026" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Set up provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          # File MUST be named by UUID for Xcode to find it
          echo $CM_PROVISIONING_PROFILE | base64 --decode > "$PROFILES_HOME/4dd97dbd-ac51-4327-a32b-8ac23e5e286c.mobileprovision"

      - name: Set up ASC API Key for altool
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_C2345LX527.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_C2345LX527.p8

      - name: Expo prebuild
        script: |
          npx expo prebuild --platform ios --clean

      - name: Configure Xcode signing
        script: |
          python3 << 'PYEOF'
import re

pbxproj = 'ios/NextSport.xcodeproj/project.pbxproj'
with open(pbxproj) as f:
    content = f.read()

TEAM = '58BKXDS287'
PROFILE_UUID = '4dd97dbd-ac51-4327-a32b-8ac23e5e286c'
PROFILE_NAME = 'NextSport AppStore Distribution v2'

signing_block = (
    '\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
    '\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
    '\n\t\t\t\tDEVELOPMENT_TEAM = ' + TEAM + ';'
    '\n\t\t\t\tPROVISIONING_PROFILE = "' + PROFILE_UUID + '";'
    '\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + PROFILE_NAME + '";'
)

pattern = r'(/\* Release \*/ = \{.*?buildSettings = \{)(.*?ASSETCATALOG_COMPILER_APPICON_NAME.*?)(\t\t\t\};)'

def inject(m):
    settings = m.group(2)
    settings = re.sub(r'\n\t+CODE_SIGN_IDENTITY[^\n]*', '', settings)
    settings = re.sub(r'\n\t+CODE_SIGN_STYLE[^\n]*', '', settings)
    settings = re.sub(r'\n\t+DEVELOPMENT_TEAM[^\n]*', '', settings)
    settings = re.sub(r'\n\t+PROVISIONING_PROFILE[^\n]*', '', settings)
    return m.group(1) + settings + signing_block + '\n' + m.group(3)

new_content, count = re.subn(pattern, inject, content, flags=re.DOTALL)
print(f"Modified {count} Release block(s)")

with open(pbxproj, 'w') as f:
    f.write(new_content)

with open(pbxproj) as f:
    verify = f.read()
assert PROFILE_UUID in verify, "FAIL: UUID not found in pbxproj!"
assert 'CODE_SIGN_STYLE = Manual' in verify, "FAIL: Manual not set!"
print("OK: pbxproj patched successfully")
PYEOF

      - name: Build iOS Archive
        script: |
          xcodebuild \
            -workspace ios/NextSport.xcworkspace \
            -scheme NextSport \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/nextsport.xcarchive \
            clean archive

      - name: Export IPA
        script: |
          mkdir -p $CM_BUILD_DIR/ipa
          cat > /tmp/export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>58BKXDS287</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.nextsport.app</key>
              <string>NextSport AppStore Distribution v2</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/nextsport.xcarchive \
            -exportOptionsPlist /tmp/export_options.plist \
            -exportPath $CM_BUILD_DIR/ipa

      - name: Upload to TestFlight
        script: |
          xcrun altool --upload-app \
            -f "$CM_BUILD_DIR/ipa/nextsport.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --type ios

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/nextsport.xcarchive

    publishing:
      email:
        recipients:
          - developer.sensforge@gmail.com
