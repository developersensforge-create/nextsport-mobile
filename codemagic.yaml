workflows:
  ios-testflight:
    name: NextSport iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        EXPO_TOKEN: "LS9tC4kVqw-_uHGBsA3cEaKkPu5T7nS8eSCc7r52H_c"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "C2345LX527"
        APP_STORE_CONNECT_ISSUER_ID: "5fd238fa-843c-4575-a581-bc0cb45b1798"
        BUNDLE_ID: "com.nextsport.app"
      xcode: "26.3"
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          # Xcode 26.3 Swift 6 compat: add Foundation/UIKit to Swift files that need it
          # Skip: React Native internals, SPM packages, and files in ObjC-heavy modules
          find node_modules -name "*.swift" \
            -not -path "*/react-native/React*" \
            -not -name "Package.swift" \
            -not -path "*/expo-audio/*" \
            -not -path "*/expo-modules-core/*" | while read f; do
            if ! grep -q "import Foundation" "$f"; then
              printf 'import Foundation\nimport UIKit\n' | cat - "$f" > /tmp/swift_fix.swift && mv /tmp/swift_fix.swift "$f"
            fi
          done
          # Mixpanel needs React import
          MP="node_modules/mixpanel-react-native/ios/MixpanelReactNative.swift"
          if [ -f "$MP" ] && ! grep -q "import React" "$MP"; then
            printf 'import React\n' | cat - "$MP" > /tmp/swift_mp.swift && mv /tmp/swift_mp.swift "$MP"
          fi

      - name: Set up ASC API Key
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_C2345LX527.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_C2345LX527.p8

      - name: Expo prebuild
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Build iOS Archive
        script: |
          xcodebuild \
            -workspace ios/NextSport.xcworkspace \
            -scheme NextSport \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/nextsport.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_C2345LX527.p8 \
            -authenticationKeyID C2345LX527 \
            -authenticationKeyIssuerID 5fd238fa-843c-4575-a581-bc0cb45b1798 \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=58BKXDS287 \
            OTHER_SWIFT_FLAGS="-strict-concurrency=minimal" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            clean archive

      - name: Export IPA
        script: |
          mkdir -p $CM_BUILD_DIR/ipa
          cat > /tmp/export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>58BKXDS287</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/nextsport.xcarchive \
            -exportOptionsPlist /tmp/export_options.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_C2345LX527.p8 \
            -authenticationKeyID C2345LX527 \
            -authenticationKeyIssuerID 5fd238fa-843c-4575-a581-bc0cb45b1798

      - name: Upload to TestFlight
        script: |
          xcrun altool --upload-app \
            -f "$CM_BUILD_DIR/ipa/nextsport.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --type ios

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - $CM_BUILD_DIR/nextsport.xcarchive

    publishing:
      email:
        recipients:
          - developer.sensforge@gmail.com